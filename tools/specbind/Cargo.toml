[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Huruikagi/specbind"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[package]
name = "specbind"
description = "Bind durable specifications to agent-assisted software delivery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
camino = "1.2.5"
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
dialoguer = { version = "0.12.0", default-features = false }
hex = "0.4.3"
include_dir = "0.7.4"
jsonschema = { version = "0.49.9", default-features = false }
petgraph = { version = "0.8.3", default-features = false, features = ["graphmap", "std"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
saphyr-parser = "0.0.11"
schemars = { version = "1.2.2", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.1.0"
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "local-offset", "parsing", "serde"] }
tempfile = "3.27.0"
uuid = { version = "1.24.1", features = ["rng-getrandom", "serde", "v7"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["json"] }
predicates = "3.1.4"
proptest = "1.11.0"
