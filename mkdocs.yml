site_name: SpecBind
site_description: Durable specifications bound to agent-assisted software delivery
site_url: https://huruikagi.github.io/specbind/
repo_url: https://github.com/Huruikagi/specbind
repo_name: Huruikagi/specbind
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  architecture.md
  documentation-authoring.md
  design/
  repository-map.md
  skill-forward-tests.md
  skill-forward-tests/

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang: en
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-7
                  name: ダークモードに切り替える
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-4
                  name: ライトモードに切り替える
          nav:
            - ホーム: index.md
            - ユーザーガイド:
                - ルートを選ぶ: guide/getting-started.md
                - 新規プロジェクトで始める: guide/start-new-project.md
                - 既存プロジェクトで始める: guide/start-existing-project.md
                - SpecBindをアップデートする: guide/update.md
                - 基本概念: guide/concepts.md
                - 1件ずつ計画・実装する: guide/implement-step-by-step.md
                - PlanとDriveでMilestoneを進める: guide/implement-with-plan-and-drive.md
                - 既存実装からSpecを確立する: guide/adopt-existing.md
                - リリースする: guide/release.md
                - カスタマイズ: guide/customization.md
                - バグ報告と改善提案: guide/feedback.md
                - エージェントの削除とアンインストール: guide/uninstall.md
                - cc-sddから移行: guide/migrate-from-cc-sdd.md
          nav_translations:
            Home: ホーム
            User guide: ユーザーガイド
            Choose a route: ルートを選ぶ
            Start a new project: 新規プロジェクトで始める
            Start with an existing project: 既存プロジェクトで始める
            Update SpecBind: SpecBindをアップデートする
            Core concepts: 基本概念
            Plan and implement one item at a time: 1件ずつ計画・実装する
            Plan and Drive a Milestone: PlanとDriveでMilestoneを進める
            Adopt an existing implementation: 既存実装からSpecを確立する
            Release a milestone: リリースする
            Customize SpecBind: カスタマイズ
            Report bugs and suggest improvements: バグ報告と改善提案
            Remove an Agent or uninstall: エージェントの削除とアンインストール
            Migrate from cc-sdd: cc-sddから移行

markdown_extensions:
  - admonition
  - attr_list
  - markdown_cjk_spacing.cjk_spacing:
      segment_break: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User guide:
      - Choose a route: guide/getting-started.md
      - Start a new project: guide/start-new-project.md
      - Start with an existing project: guide/start-existing-project.md
      - Update SpecBind: guide/update.md
      - Core concepts: guide/concepts.md
      - Plan and implement one item at a time: guide/implement-step-by-step.md
      - Plan and Drive a Milestone: guide/implement-with-plan-and-drive.md
      - Adopt an existing implementation: guide/adopt-existing.md
      - Release a milestone: guide/release.md
      - Customize SpecBind: guide/customization.md
      - Report bugs and suggest improvements: guide/feedback.md
      - Remove an Agent or uninstall: guide/uninstall.md
      - Migrate from cc-sdd: guide/migrate-from-cc-sdd.md
  - Reference:
      - Skills: reference/current-skill-index.md
      - Artifacts: reference/current-artifact-index.md
