site_name: SpecBind
site_description: Durable specifications bound to agent-assisted software delivery
site_url: https://huruikagi.github.io/specbind/
repo_url: https://github.com/Huruikagi/specbind
repo_name: Huruikagi/specbind
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  architecture.md
  documentation-authoring.md
  design/
  repository-map.md
  skill-forward-tests.md
  skill-forward-tests/

theme:
  name: material
  language: ja
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替える

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - ドキュメント: index.md
  - 日本語:
      - ホーム: ja/index.md
      - ユーザーガイド:
          - Getting Started:
              - ルートを選ぶ: ja/guide/getting-started.md
              - 新規プロジェクトで始める: ja/guide/start-new-project.md
              - 既存プロジェクトで始める: ja/guide/start-existing-project.md
          - 基本概念: ja/guide/concepts.md
          - 既存実装からSpecを確立する: ja/guide/adopt-existing.md
          - カスタマイズ: ja/guide/customization.md
          - バグ報告と改善提案: ja/guide/feedback.md
          - Agentの削除とアンインストール: ja/guide/uninstall.md
      - cc-sddから移行: ja/guide/migrate-from-cc-sdd.md
  - cc-sddから移行:
      - ガイド入口: guide/migration/cc-sdd.md
      - English: guide/en/migrate-from-cc-sdd.md
  - リファレンス:
      - スキル一覧: current-skill-index.md
      - 成果物一覧: current-artifact-index.md
