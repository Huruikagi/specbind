name: Bug report / バグ報告
description: Report reproducible behavior that appears incorrect. / 再現可能な不具合を報告します。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve SpecBind. 日本語でも英語でも報告できます。

        This form covers the CLI, product-managed Skills, agent integrations, and documentation.
        CLI、製品管理のSkill、Agent連携、ドキュメントの問題を報告できます。

        Remove secrets and private project content from every field before submitting.
        送信前に、秘密情報や非公開のプロジェクト内容をすべての項目から取り除いてください。

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface / 問題がある領域
      options:
        - CLI
        - Product-managed Skill or orchestration / 製品管理のSkill・オーケストレーション
        - Agent integration or installed assets / Agent連携・インストール済みファイル
        - Documentation / ドキュメント
        - Unsure or multiple surfaces / 不明・複数領域
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary / 概要
      description: Briefly describe what went wrong. / 何が問題だったかを簡潔に記載してください。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SpecBind version / バージョン
      description: Paste the complete output of `specbind --version`. / コマンドの出力全体を貼り付けてください。
      placeholder: specbind 1.0.0-rc.2
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment and agent / 環境とAgent
      description: Include the OS, installation method, coding agent or client, and its version when relevant. / OS、インストール方法、関係するコーディングAgentやクライアントとそのバージョンを記載してください。
      placeholder: |
        OS: Windows 11 x64
        Installation: mise
        Agent or client: Codex
        Agent or client version: ...
    validations:
      required: true

  - type: input
    id: entrypoint
    attributes:
      label: Related command or Skill / 関連するコマンドまたはSkill
      description: Name the command, Skill, or installed asset involved. Use unknown if you cannot identify it. / 関係するコマンド、Skill、インストール済みファイルを記載してください。不明な場合はunknownと記載します。
      placeholder: specbind milestone status or specbind-discovery
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps / 再現手順
      description: Provide the smallest sequence that reproduces the problem. For a Skill problem, include the original sanitized request. / 最小限の再現手順を記載してください。Skillの問題では、機密情報を除去した元の依頼も含めます。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期待した結果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence / 実際の結果と証拠
      description: Include relevant sanitized CLI output, generated artifacts, or Git diff. Preserve stable diagnostic codes. / 機密情報を除去したCLI出力、生成された成果物、Git差分などを含め、診断コードは残してください。
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks / 送信前の確認
      options:
        - label: I searched existing issues for the same problem. / 同じ問題が既に報告されていないか確認しました。
          required: true
        - label: I removed secrets and private project content. / 秘密情報と非公開のプロジェクト内容を除去しました。
          required: true
