name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Cargo version to verify without publishing (for example, 1.0.0-rc.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin

    defaults:
      run:
        working-directory: tools/specbind

    env:
      RUST_TARGET: ${{ matrix.target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/specbind -> target"

      - name: Check tag and Cargo version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Release tag is not supported SemVer: $env:RELEASE_TAG"
          }
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'specbind' }
          $expected = $env:RELEASE_TAG.Substring(1)
          if ($package.version -ne $expected) {
            throw "Cargo version '$($package.version)' does not match tag '$env:RELEASE_TAG'."
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check generated schemas
        run: cargo run --example generate_schemas -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build release binary
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'specbind-package'
          $archive = "specbind-$env:RELEASE_TAG-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/$env:RUST_TARGET/release/specbind.exe", ../../README.md, ../../LICENSE -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$archive"

          $smoke = Join-Path $env:RUNNER_TEMP 'specbind-smoke'
          Expand-Archive -LiteralPath "dist/$archive" -DestinationPath $smoke
          $actual = & "$smoke/specbind.exe" --version
          $expected = "specbind $($env:RELEASE_TAG.Substring(1))"
          if ($actual -ne $expected) {
            throw "Archive reports '$actual'; expected '$expected'."
          }
          "Windows x64: $env:ImageOS $env:ImageVersion" |
            Set-Content -Encoding utf8NoBOM "dist/environment-$env:RUST_TARGET.txt"

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/specbind-package"
          archive="specbind-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$stage" dist
          install -m 755 "target/$RUST_TARGET/release/specbind" "$stage/specbind"
          install -m 644 ../../README.md ../../LICENSE "$stage/"
          tar -C "$stage" -czf "dist/$archive" specbind README.md LICENSE

          smoke="$RUNNER_TEMP/specbind-smoke"
          mkdir -p "$smoke"
          tar -C "$smoke" -xzf "dist/$archive"
          actual=$("$smoke/specbind" --version)
          expected="specbind ${RELEASE_TAG#v}"
          test "$actual" = "$expected"
          printf 'Linux x64: %s %s\n' "$ImageOS" "$ImageVersion" \
            > "dist/environment-$RUST_TARGET.txt"

      - name: Package macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/specbind-package"
          archive="specbind-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz"
          mkdir -p "$stage" dist
          install -m 755 "target/$RUST_TARGET/release/specbind" "$stage/specbind"
          install -m 644 ../../README.md ../../LICENSE "$stage/"
          tar -C "$stage" -czf "dist/$archive" specbind README.md LICENSE

          smoke="$RUNNER_TEMP/specbind-smoke"
          project="$RUNNER_TEMP/specbind-project-smoke"
          mkdir -p "$smoke" "$project"
          tar -C "$smoke" -xzf "dist/$archive"
          actual=$("$smoke/specbind" --version)
          expected="specbind ${RELEASE_TAG#v}"
          test "$actual" = "$expected"
          "$smoke/specbind" schema read spec/v1 > "$smoke/spec-v1.schema.json"
          test -s "$smoke/spec-v1.schema.json"
          git -C "$project" init
          (
            cd "$project"
            "$smoke/specbind" install --dry-run --agent codex --language en
          )
          printf 'macOS ARM64: macOS %s (%s)\n' \
            "$(sw_vers -productVersion)" "$(uname -m)" \
            > "dist/environment-$RUST_TARGET.txt"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            tools/specbind/dist/specbind-*
            tools/specbind/dist/environment-*
          if-no-files-found: error
          compression-level: 0

  verify-release:
    name: Verify release archives
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/specbind-*.zip dist/specbind-*.tar.gz)
          if [[ ${#archives[@]} -ne 3 ]]; then
            echo "Expected three release archives, found ${#archives[@]}." >&2
            exit 1
          fi
          (
            cd dist
            LC_ALL=C sha256sum specbind-* > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/specbind-*
            dist/environment-*
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          environments=$(LC_ALL=C sort dist/environment-*.txt)
          notes=$(printf 'Built and smoke-tested on:\n\n%s' "$environments")
          options+=(--notes "$notes")
          gh release create "$RELEASE_TAG" \
            dist/specbind-*.zip \
            dist/specbind-*.tar.gz \
            dist/SHA256SUMS \
            "${options[@]}"

  mise-smoke:
    name: Smoke-test mise (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15

    steps:
      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Install and run SpecBind through mise
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_MINIMUM_RELEASE_AGE: 0s
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'specbind-mise-smoke'
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Set-Location -LiteralPath $smoke

          $version = $env:RELEASE_TAG.Substring(1)
          $tool = "github:$env:GITHUB_REPOSITORY@$version"
          mise use $tool
          $actual = mise exec $tool --command "specbind --version"
          $expected = "specbind $version"
          if ($actual -ne $expected) {
            throw "mise-installed archive reports '$actual'; expected '$expected'."
          }

  macos-installer-smoke:
    name: Smoke-test macOS shell installer
    if: github.event_name == 'push'
    needs: publish
    runs-on: macos-15

    steps:
      - name: Install and run SpecBind through install.sh
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/install.sh"
          install_dir="$RUNNER_TEMP/specbind-bin"
          project="$RUNNER_TEMP/specbind-installed-project"
          curl --fail --silent --show-error --location \
            --output "$installer" \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_TAG/install.sh"
          sh "$installer" --version "${RELEASE_TAG#v}" --install-dir "$install_dir"
          "$install_dir/specbind" schema read spec/v1 > "$RUNNER_TEMP/spec-v1.schema.json"
          test -s "$RUNNER_TEMP/spec-v1.schema.json"
          mkdir -p "$project"
          git -C "$project" init
          (
            cd "$project"
            "$install_dir/specbind" install --dry-run --agent codex --language en
          )
