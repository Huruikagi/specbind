name: Decisions

on:
  push:
    paths:
      - ".github/workflows/decisions.yml"
      - "docs/design/decisions/**"
      - "docs/repository-map.md"
      - "scripts/check_decisions.py"
  pull_request:
    paths:
      - ".github/workflows/decisions.yml"
      - "docs/design/decisions/**"
      - "docs/repository-map.md"
      - "scripts/check_decisions.py"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Decision index
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Decision index
        run: python scripts/check_decisions.py
