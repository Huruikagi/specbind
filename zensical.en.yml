site_name: SpecBind
site_description: Durable specifications bound to agent-assisted software delivery
site_url: https://huruikagi.github.io/specbind/
repo_url: https://github.com/Huruikagi/specbind
repo_name: Huruikagi/specbind
edit_uri: edit/main/docs/en/
docs_dir: docs/en
site_dir: site
strict: true

theme:
  custom_dir: docs/overrides
  language: en
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  alternate:
    - name: English
      link: /specbind/
      lang: en
    - name: 日本語
      link: /specbind/ja/
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - markdown_cjk_spacing.cjk_spacing:
      segment_break: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
      - Choose a route: guide/getting-started.md
      - Install SpecBind: guide/install.md
      - Start a new project: guide/start-new-project.md
      - Start with an existing project: guide/start-existing-project.md
  - Work with SpecBind:
      - Core concepts: guide/concepts.md
      - Plan and implement one item at a time: guide/implement-step-by-step.md
      - Plan and Drive a Milestone: guide/implement-with-plan-and-drive.md
      - Adopt an existing implementation: guide/adopt-existing.md
      - Release a milestone: guide/release.md
  - Configure and maintain:
      - Customize SpecBind: guide/customization.md
      - Update SpecBind: guide/update.md
      - Remove an Agent or uninstall: guide/uninstall.md
      - Migrate from cc-sdd: guide/migrate-from-cc-sdd.md
      - Report bugs and suggest improvements: guide/feedback.md
  - Reference:
      - Skills: reference/current-skill-index.md
      - Artifacts: reference/current-artifact-index.md
      - Lifecycle states: reference/lifecycle-states.md
      - CLI commands: reference/cli-commands.md
